target:
  repo: vishnuverse/humanize
  default_branch: main
  description: humanize is a Python library (vishnuverse/humanize) with functions such as ordinal, intcomma, intword, naturalsize, naturaltime, naturalday and naturaldate. It is not Django's django.contrib.humanize.
python:
  install: .venv/bin/pip install -q --disable-pip-version-check -e ".[tests]"
  test: .venv/bin/python -m pytest -q -p no:cacheprovider --benchmark-disable --color=no
  source_dir: src/humanize
  tests_dir: tests
