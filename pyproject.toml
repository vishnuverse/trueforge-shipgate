[project]
name = "trueforge-shipgate"
version = "0.1.0"
description = "shipgate: TrueForge agents with human gates (scorer, MCP servers, scripts)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp==1.30.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "mcp/triage"]
addopts = "-p no:cacheprovider -m 'not live'"
markers = ["live: calls the real TypeSafe and GitHub APIs (run with -m live)"]
